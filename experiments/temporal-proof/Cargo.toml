[package]
name = "edgeagent-temporal-proof"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
publish = false

# This decision-gate experiment intentionally does not enter the product workspace.
[workspace]

[dependencies]
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
temporalio-client = { version = "=1.0.0", default-features = false, features = ["tls-ring", "vendored-protox"] }
temporalio-common = "=1.0.0"
temporalio-macros = "=1.0.0"
temporalio-sdk = { version = "=1.0.0", default-features = false, features = ["testing"] }
temporalio-sdk-core = { version = "=0.9.0", default-features = false, features = ["tls-ring"] }
temporalio-workflow = "=1.0.0"
tokio = { version = "=1.53.1", features = ["macros", "process", "rt-multi-thread", "time"] }

[dev-dependencies]
flate2 = "=1.1.10"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
ring = "=0.17.14"
tar = "=0.4.46"
tempfile = "=3.23.0"

[[bin]]
name = "temporal-proof-worker"
path = "src/bin/worker.rs"
