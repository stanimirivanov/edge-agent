# Decision-proof-only dependency policy. Production keeps the stricter root
# deny.toml; importing a chosen runtime requires a separate license review.
[graph]
all-features = true
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]

[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.93
include-dev = true
include-build = true
unused-allowed-license = "allow"
unused-license-exception = "deny"
allow = [
    "0BSD",                  # enum-iterator, zero-clause permissive code license
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-2-Clause-Patent", # Flawless workflow libraries; server binary is separate
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",   # webpki-roots trust-anchor data
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
    "bzip2-1.0.6",          # libbz2-rs-sys permissive compression license
]
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
allow = []
deny = []
skip = []
skip-tree = []

[bans.workspace-dependencies]
duplicates = "deny"
include-path-dependencies = true
unused = "deny"

[bans.std-replacements]
scope = "workspace"
level = "deny"
rust-version = "1.98.1"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
