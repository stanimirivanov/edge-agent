[workspace]
resolver = "3"
members = [
    "crates/audit-domain",
    "crates/research-domain",
    "crates/research-application",
    "crates/research-postgres",
    "crates/contracts",
    "crates/event-spine-conformance",
    "crates/inbox-handler",
    "crates/inbox-postgres",
    "crates/market-data-domain",
    "crates/market-data-application",
    "crates/market-data-http",
    "crates/market-data-object-store",
    "crates/market-data-postgres",
    "crates/market-data-replay",
    "crates/messaging",
    "crates/messaging-nats",
    "crates/outbox-postgres",
    "crates/outbox-relay",
    "crates/service-runtime",
    "crates/simulation-domain",
    "crates/simulation-postgres",
    "crates/telemetry",
    "crates/xtask",
    "services/audit-projector",
    "services/execution-simulator",
    "services/gateway",
    "services/market-data",
    "services/research",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/stanimirivanov/edge-agent"

[workspace.dependencies]
edgeagent-research-application = { path = "crates/research-application" }
edgeagent-research-postgres = { path = "crates/research-postgres" }
edgeagent-research-domain = { path = "crates/research-domain" }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
fastwebsockets = { version = "=0.10.0", default-features = false }
http-body-util = { version = "=0.1.5", default-features = false }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
sha1 = { version = "=0.10.7", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
async-nats = { version = "=0.50.0", default-features = false, features = ["jetstream", "ring", "server_2_14"] }
bytes = "=1.12.1"
cargo_metadata = { version = "=0.23.1", default-features = false }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
chrono-tz = { version = "=0.10.4", default-features = false, features = ["std"] }
cloudevents = { package = "cloudevents-sdk", version = "=0.9.0", default-features = false }
edgeagent-contracts = { path = "crates/contracts" }
edgeagent-audit-domain = { path = "crates/audit-domain" }
edgeagent-market-data-domain = { path = "crates/market-data-domain" }
edgeagent-market-data-application = { path = "crates/market-data-application" }
edgeagent-market-data-replay = { path = "crates/market-data-replay" }
edgeagent-market-data-postgres = { path = "crates/market-data-postgres" }
edgeagent-market-data-object-store = { path = "crates/market-data-object-store" }
edgeagent-market-data-http = { path = "crates/market-data-http" }
edgeagent-simulation-domain = { path = "crates/simulation-domain" }
edgeagent-simulation-postgres = { path = "crates/simulation-postgres" }
edgeagent-inbox-postgres = { path = "crates/inbox-postgres" }
edgeagent-messaging = { path = "crates/messaging" }
edgeagent-messaging-nats = { path = "crates/messaging-nats" }
edgeagent-outbox-postgres = { path = "crates/outbox-postgres" }
edgeagent-outbox-relay = { path = "crates/outbox-relay" }
edgeagent-service-runtime = { path = "crates/service-runtime" }
edgeagent-telemetry = { path = "crates/telemetry" }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
jsonschema = { version = "=0.58.6", default-features = false }
libm = { version = "=0.2.16", default-features = false }
metrics = "=0.24.6"
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
percent-encoding = { version = "=2.3.2", default-features = false }
pulldown-cmark = { version = "=0.13.5", default-features = false }
prost = { version = "=0.14.4", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.5"
httpdate = "=1.0.3"
object_store = { version = "=0.14.2", default-features = false, features = ["fs"] }
rand_chacha = { version = "=0.10.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
schemars = { version = "=1.2.3", default-features = false, features = ["derive", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "derive", "macros"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
url = "=2.5.8"
yaml-rust2 = { version = "=0.13.0", default-features = false }

[workspace.dependencies.tokio]
version = "=1.53.3"
features = ["macros", "rt-multi-thread"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
