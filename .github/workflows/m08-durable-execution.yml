name: M08 durable-execution proofs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: m08-durable-execution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Check repository policy
        run: cargo xtask repository
      - name: Check capability dependency policy
        run: cargo xtask architecture

  proof:
    name: M08 proof (${{ matrix.candidate }})
    runs-on: ubuntu-latest
    needs: architecture
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        candidate:
          - event-spine-proof
          - durable-execution
          - dbos-proof
          - temporal-proof
          - flawless-proof
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Check proof formatting
        run: cargo fmt --manifest-path experiments/${{ matrix.candidate }}/Cargo.toml --all --check
      - name: Lint proof
        run: cargo clippy --locked --workspace --manifest-path experiments/${{ matrix.candidate }}/Cargo.toml --all-targets -- -D warnings
      - name: Audit proof dependencies and licenses
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          manifest-path: experiments/${{ matrix.candidate }}/Cargo.toml
          arguments: --locked --workspace --config experiments/deny.toml
          command: check
      - name: Run self-provisioning proof
        run: cargo test --locked --workspace --manifest-path experiments/${{ matrix.candidate }}/Cargo.toml --all-targets
