name: Release OCI images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PLATFORM: linux/amd64
  COSIGN_VERSION: v3.1.3
  SYFT_VERSION: 1.52.0

jobs:
  plan:
    name: Plan immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Derive release matrix from deployable inventory
        id: plan
        run: >-
          python scripts/prepare_release.py
          --tag "${{ github.ref_name }}"
          --repository "${{ github.repository }}"
          --registry "${{ env.REGISTRY }}"
          --github-output "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.service }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and publish image once
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORM }}
          pull: true
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ matrix.image }}:${{ needs.plan.outputs.version }}
            ${{ matrix.image }}:${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            SOURCE_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v${{ env.SYFT_VERSION }}
      - name: Generate SBOM from published digest
        run: >-
          python scripts/generate_sboms.py release
          --service "${{ matrix.service }}"
          --image "${{ matrix.image }}"
          --digest "${{ steps.build.outputs.digest }}"
          --output artifacts/sbom
          --syft "${{ steps.syft.outputs.cmd }}"
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-version: ${{ needs.plan.outputs.version }}
          push-to-registry: true
      - name: Attest CycloneDX SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          subject-version: ${{ needs.plan.outputs.version }}
          sbom-path: artifacts/sbom/${{ matrix.binary }}.image.cdx.json
          push-to-registry: true
      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}
      - name: Sign immutable image digest
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify keyless signature
        env:
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: >-
          cosign verify
          --certificate-identity "${CERTIFICATE_IDENTITY}"
          --certificate-oidc-issuer "${OIDC_ISSUER}"
          "${IMAGE}@${DIGEST}"
      - name: Verify provenance and SBOM attestations
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${{ github.repository }}" --predicate-type https://slsa.dev/provenance/v1
          gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${{ github.repository }}" --predicate-type https://cyclonedx.org/bom
