name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Check CI security policy
        id: workflow-policy
        run: cargo xtask workflow-security
      - name: Check repository policy
        run: cargo xtask repository
      - name: Check capability dependency policy
        run: cargo xtask architecture

  security:
    name: Secret scanning
    runs-on: ubuntu-latest
    needs: architecture
    timeout-minutes: 15
    steps:
      - name: Check out complete source history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install checksum-verified Gitleaks
        id: secret-scanner-install
        run: python scripts/install_gitleaks.py
      - name: Prove secret-scanner detection and fixture isolation
        id: secret-scanner-contracts
        run: cargo xtask verify --check secret-scanner-contracts
      - name: Scan source tree and complete history
        id: secret-scan
        run: cargo xtask verify --check secret-scan

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [architecture, security]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Run canonical acceptance contract
        run: cargo xtask verify

  offline-source-isolation:
    name: Offline source network isolation
    runs-on: ubuntu-latest
    needs: [architecture, security]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build locked offline proof before disabling networking
        run: cargo test --locked -p edgeagent-market-data-replay --test offline --no-run
      - name: Prove offline source with networking disabled
        run: cargo xtask verify --check offline-source-network-denial

  container-smoke:
    name: Container smoke tests
    runs-on: ubuntu-latest
    needs: [architecture, security]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Build and smoke-test service images
        run: cargo xtask verify image-smoke

  local-platform-smoke:
    name: Local platform smoke tests
    runs-on: ubuntu-latest
    needs: [architecture, security]
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Validate Compose configuration
        run: docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml config --quiet
      - name: Start local platform
        run: docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml up --detach
      - name: Verify local platform readiness
        run: python scripts/verify_local_stack.py --running
      - name: Install pinned SQLx metadata tool
        run: cargo install sqlx-cli --version '=0.9.0' --no-default-features --features postgres,rustls
      - name: Verify SQLx query metadata against inbox and outbox migrations
        env:
          DATABASE_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
          SQLX_OFFLINE: "false"
          EDGEAGENT_SQLX_METADATA_LOCAL: "1"
        run: cargo xtask verify sqlx-metadata
      - name: Run discovered local-platform conformance proofs
        env:
          EDGEAGENT_NATS_URL: nats://127.0.0.1:4222
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
          EDGEAGENT_NATS_COMPOSE_RESTART: "1"
        run: cargo xtask verify local-platform
      - name: Print diagnostics after failure
        if: failure()
        run: docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml logs --no-color --tail=200
      - name: Qualify M02 with isolated owned dependencies
        run: cargo xtask m02-qualification
      - name: Retain M02 qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edgeagent-m02-${{ github.sha }}
          path: artifacts/m02-qualification/*/results.tsv
          if-no-files-found: error
          retention-days: 14
      - name: Stop local platform
        if: always()
        run: docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml down --volumes

  supply-chain:
    name: Dependency policy and SBOMs
    runs-on: ubuntu-latest
    needs: [architecture, security]
    timeout-minutes: 45
    env:
      CARGO_CYCLONEDX_VERSION: "0.5.9"
      SYFT_VERSION: "1.52.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install pinned Cargo SBOM tool
        run: cargo install --locked cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION"
      - name: Enforce dependency, advisory, source, and license policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          arguments: --locked
          command: check
      - name: Generate Rust binary SBOMs
        run: python scripts/generate_sboms.py rust --output artifacts/sbom
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v${{ env.SYFT_VERSION }}
      - name: Generate OCI image SBOMs
        env:
          SYFT_BINARY: ${{ steps.syft.outputs.cmd }}
        run: python scripts/generate_sboms.py images --output artifacts/sbom --syft "${SYFT_BINARY}"
      - name: Validate complete CycloneDX artifact set
        run: python scripts/verify_supply_chain.py --artifacts artifacts/sbom
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edgeagent-sboms-${{ github.sha }}
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 14
