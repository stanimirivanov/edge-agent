name: Repository quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Architecture policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Check repository policy
        run: cargo xtask repository
      - name: Check capability dependency policy
        run: cargo xtask architecture

  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: architecture
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - name: Check text formatting
        run: python scripts/verify_repository.py --format-check
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Check repository contracts
        run: python scripts/verify_repository.py
      - name: Check rendered repository policy
        run: cargo xtask repository
      - name: Check architecture boundaries
        run: python scripts/verify_architecture.py
      - name: Check OCI image contracts
        run: python scripts/verify_images.py
      - name: Check supply-chain contracts
        run: python scripts/verify_supply_chain.py
      - name: Check release contracts
        run: python scripts/verify_release.py
      - name: Check locked dependency graph
        run: cargo metadata --locked --offline --format-version 1 --no-deps
      - name: Check Rust workspace
        run: cargo check --locked --workspace --all-targets
      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run harness tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Run Rust tests
        run: cargo test --locked --workspace --all-targets
      - name: Verify canonical envelope bytes with preserve_order
        run: cargo test --locked -p edgeagent-contracts --features serde_json/preserve_order

  container-smoke:
    name: Container smoke tests
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build and smoke-test service images
        run: python scripts/verify_images.py --build

  local-platform-smoke:
    name: Local platform smoke tests
    runs-on: ubuntu-latest
    needs: architecture
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Validate Compose configuration
        run: docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml config --quiet
      - name: Start local platform
        run: docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml up --detach
      - name: Verify local platform readiness
        run: python scripts/verify_local_stack.py --running
      - name: Install pinned SQLx metadata tool
        run: cargo install sqlx-cli --version '=0.9.0' --no-default-features --features postgres,rustls
      - name: Verify SQLx query metadata against inbox and outbox migrations
        env:
          DATABASE_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
          SQLX_OFFLINE: "false"
        run: |
          cargo sqlx migrate run --source crates/outbox-postgres/migrations --no-dotenv
          for migration in crates/inbox-postgres/migrations/*.sql; do
            docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml exec -T postgres \
              psql -X -v ON_ERROR_STOP=1 -U edgeagent -d edgeagent < "$migration"
          done
          cargo sqlx prepare --workspace --no-dotenv -- --locked --all-targets
          git status --short -- .sqlx
          test -z "$(git status --porcelain -- .sqlx)"
      - name: Verify JetStream publisher conformance
        env:
          EDGEAGENT_NATS_URL: nats://127.0.0.1:4222
        run: cargo test --locked -p edgeagent-messaging-nats --test jetstream_publish -- --ignored --exact persisted_message_identity_deduplicates_on_retry
      - name: Verify JetStream consumer conformance
        env:
          EDGEAGENT_NATS_URL: nats://127.0.0.1:4222
        run: cargo test --locked -p edgeagent-messaging-nats --test jetstream_consume -- --ignored --exact delivery_settlement_controls_redelivery_and_acknowledgement
      - name: Verify PostgreSQL outbox conformance
        env:
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
        run: cargo test --locked -p edgeagent-outbox-postgres --test postgres_outbox -- --ignored --exact transaction_identity_and_lease_invariants_hold
      - name: Verify same-owner outbox lease fencing
        env:
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
        run: |
          cargo test --locked -p edgeagent-outbox-postgres --test postgres_outbox -- --list | grep -Fx 'same_owner_reclaim_rejects_stale_transitions_and_preserves_replay_fence: test'
          cargo test --locked -p edgeagent-outbox-postgres --test postgres_outbox -- --ignored --exact same_owner_reclaim_rejects_stale_transitions_and_preserves_replay_fence
      - name: Verify PostgreSQL inbox conformance
        env:
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
        run: cargo test --locked -p edgeagent-inbox-postgres --tests -- --ignored
      - name: Verify transactional handler conformance
        env:
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
        run: cargo test --locked -p edgeagent-inbox-handler --test postgres_handler -- --ignored --exact coordinator_preserves_commit_retry_and_quarantine_ordering
      - name: Verify atomic SQLx inbox and outbox enqueue
        env:
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
        run: cargo test --locked -p edgeagent-inbox-handler --test sqlx_outbox_atomicity -- --ignored --exact inbox_domain_and_sqlx_outbox_commit_or_roll_back_together
      - name: Verify bounded outbox relay conformance
        env:
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
        run: cargo test --locked -p edgeagent-outbox-relay --test postgres_relay -- --ignored --exact relay_bounds_retry_and_quarantines_terminal_failures
      - name: Verify end-to-end event spine recovery
        env:
          EDGEAGENT_NATS_URL: nats://127.0.0.1:4222
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
        run: cargo test --locked -p edgeagent-inbox-handler --test event_spine -- --ignored --exact durable_command_survives_client_restart_with_one_domain_transition
      - name: Verify end-to-end broker restart recovery
        env:
          EDGEAGENT_NATS_URL: nats://127.0.0.1:4222
          EDGEAGENT_POSTGRES_URL: postgresql://edgeagent:edgeagent-local-postgres@127.0.0.1:5432/edgeagent
          EDGEAGENT_NATS_COMPOSE_RESTART: "1"
        run: cargo test --locked -p edgeagent-inbox-handler --test event_spine -- --ignored --exact durable_command_survives_broker_restart_with_one_domain_transition
      - name: Print diagnostics after failure
        if: failure()
        run: docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml logs --no-color --tail=200
      - name: Stop local platform
        if: always()
        run: docker compose --env-file deploy/local/.env.example -f deploy/local/compose.yaml down --volumes

  supply-chain:
    name: Dependency policy and SBOMs
    runs-on: ubuntu-latest
    needs: architecture
    env:
      CARGO_CYCLONEDX_VERSION: "0.5.9"
      SYFT_VERSION: "1.52.0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Install pinned Cargo SBOM tool
        run: cargo install --locked cargo-cyclonedx --version "$CARGO_CYCLONEDX_VERSION"
      - name: Enforce dependency, advisory, source, and license policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: "1.98.1"
          arguments: --locked
          command: check
      - name: Generate Rust binary SBOMs
        run: python scripts/generate_sboms.py rust --output artifacts/sbom
      - name: Install pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v${{ env.SYFT_VERSION }}
      - name: Generate OCI image SBOMs
        run: python scripts/generate_sboms.py images --output artifacts/sbom --syft "${{ steps.syft.outputs.cmd }}"
      - name: Validate complete CycloneDX artifact set
        run: python scripts/verify_supply_chain.py --artifacts artifacts/sbom
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: edgeagent-sboms-${{ github.sha }}
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 14
