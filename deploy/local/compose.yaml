name: edgeagent-local

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${EDGEAGENT_POSTGRES_DB}
      POSTGRES_PASSWORD: ${EDGEAGENT_POSTGRES_PASSWORD}
      POSTGRES_USER: ${EDGEAGENT_POSTGRES_USER}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres-data:/var/lib/postgresql

  nats:
    image: nats:2.14.7-alpine
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
      - --name=edgeagent-local
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      test:
        - CMD-SHELL
        - wget --quiet --spider 'http://127.0.0.1:8222/healthz?js-enabled-only=true'
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s
    security_opt:
      - no-new-privileges:true
    volumes:
      - nats-data:/data

  object-store:
    image: ghcr.io/chrislusf/seaweedfs:4.47
    command:
      - mini
      - -dir=/data
      - -s3.port=8333
    environment:
      AWS_ACCESS_KEY_ID: ${EDGEAGENT_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${EDGEAGENT_S3_SECRET_KEY}
      S3_BUCKET: ${EDGEAGENT_S3_BUCKET}
    ports:
      - "127.0.0.1:8333:8333"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:9333/cluster/status"]
      interval: 2s
      timeout: 3s
      retries: 45
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    volumes:
      - object-data:/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

volumes:
  nats-data:
  object-data:
  postgres-data:
